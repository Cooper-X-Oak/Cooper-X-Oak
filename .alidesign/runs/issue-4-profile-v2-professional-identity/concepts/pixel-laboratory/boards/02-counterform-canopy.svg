<line x1="72" y1="542" x2="1224" y2="542" stroke="#111512" stroke-width="2"/>
<text x="72" y="586" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">01 / QUESTION</text>
<text x="320" y="586" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">How should a workflow know which specialist must act next?</text>
<line x1="72" y1="614" x2="1224" y2="614" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="654" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">02 / HYPOTHESIS</text>
<text x="320" y="654" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Make capability, provider, inputs, outputs and gates explicit before mutation.</text>
<line x1="72" y1="682" x2="1224" y2="682" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="722" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">03 / EVIDENCE</text>
<text x="320" y="717" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">The local contract rejects missing visual providers, seals route history</text>
<text x="320" y="736" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">and keeps UI mutation closed until required capability work exists.</text>
<line x1="72" y1="756" x2="1224" y2="756" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="790" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">04 / NEXT</text>
<text x="320" y="790" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Publish a clear case, then learn whether the contract is useful outside this profile experiment.</text>
<text x="72" y="854" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">WORKING PRINCIPLES</text>
