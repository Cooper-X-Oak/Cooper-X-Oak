<line x1="72" y1="552" x2="1224" y2="552" stroke="#111512" stroke-width="2"/>
<text x="72" y="596" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">01 / QUESTION</text>
<text x="320" y="596" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">How should a workflow know which specialist must act next?</text>
<line x1="72" y1="624" x2="1224" y2="624" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="664" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">02 / HYPOTHESIS</text>
<text x="320" y="664" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Make capability, provider, inputs, outputs and gates explicit before mutation.</text>
<line x1="72" y1="692" x2="1224" y2="692" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="732" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">03 / EVIDENCE</text>
<text x="320" y="727" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">The local contract rejects missing visual providers, seals route history</text>
<text x="320" y="746" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">and keeps UI mutation closed until required capability work exists.</text>
<line x1="72" y1="766" x2="1224" y2="766" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="800" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">04 / NEXT</text>
<text x="320" y="800" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Publish a clear case, then learn whether the contract is useful outside this profile experiment.</text>
<text x="72" y="859" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">WORKING PRINCIPLES</text>
