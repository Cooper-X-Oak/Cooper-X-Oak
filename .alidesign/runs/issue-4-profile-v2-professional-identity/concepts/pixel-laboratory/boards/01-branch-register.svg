<text x="400" y="410" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="13" font-weight="700" letter-spacing="0.7" text-anchor="start">AI WORKFLOW EXPERIMENTER / CURRENTLY TESTING CAPABILITY ROUTING</text>
<text x="72" y="500" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="13" font-weight="700" letter-spacing="1" text-anchor="start">CURRENT EXPERIMENT / CAPABILITY ROUTING</text>
<line x1="72" y1="522" x2="1224" y2="522" stroke="#111512" stroke-width="2"/>
<text x="72" y="566" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">01 / QUESTION</text>
<text x="320" y="566" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">How should a workflow know which specialist must act next?</text>
<line x1="72" y1="594" x2="1224" y2="594" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="638" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">02 / HYPOTHESIS</text>
<text x="320" y="638" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Make capability, provider, inputs, outputs and gates explicit before mutation.</text>
<line x1="72" y1="666" x2="1224" y2="666" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="710" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">03 / EVIDENCE</text>
<text x="320" y="705" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">The local contract rejects missing visual providers, seals route history</text>
<text x="320" y="724" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">and keeps UI mutation closed until required capability work exists.</text>
<line x1="72" y1="744" x2="1224" y2="744" stroke="#CDD3CD" stroke-width="1"/>
<text x="72" y="782" fill="#5C655E" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">04 / NEXT</text>
<text x="320" y="782" fill="#111512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Publish a clear case, then learn whether the contract is useful outside this profile experiment.</text>
<text x="72" y="844" fill="#173F2D" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="12" font-weight="700" letter-spacing="0.8" text-anchor="start">WORKING PRINCIPLES</text>
