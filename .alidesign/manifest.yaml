version: 1
project: "Cooper-X-Oak/Cooper-X-Oak"
workflow:
  skill: "$alidesign-engineering"
  control_root: ".alidesign"
  allowed_modes:
    - "full"
    - "evaluation-loop"
scope:
  include:
    - "GitHub profile README information architecture and content"
    - "One responsive, non-interactive signature visual"
    - "Structured authoring source, generator, local preview, and generated profile assets"
    - "Task-scoped design declarations and evaluation evidence"
  exclude:
    - "GitHub avatar replacement"
    - "GitHub social/profile field changes"
    - "Pinned repository changes"
    - "Unrelated repository UI or legacy asset cleanup"
    - "New frameworks or runtime dependencies"
authority:
  domain: ".alidesign/declarations/domain.md"
  craft: ".alidesign/declarations/craft.md"
  design_system: ".alidesign/declarations/design-system.md"
  components: ".alidesign/declarations/components.md"
  templates: ".alidesign/declarations/templates.md"
  runs: ".alidesign/runs/"
  task_request: "Conversation approvals on 2026-07-15; GitHub Issue #2 is the v1 baseline and Issue #4 is the schema-v2 redesign"
  repository_policy: "AGENTS.md"
  platform:
    - "https://docs.github.com/en/account-and-profile/concepts/personal-profile"
    - "https://docs.github.com/en/account-and-profile/reference/profile-reference"
    - "https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax"
  public_facts:
    - "GitHub GraphQL/API snapshot recorded in the active run content evidence"
    - "Public repository READMEs and release pages linked by the active run"
roadmap: ".alidesign/roadmap.md"
milestones: ".alidesign/milestones/"
issues: ".alidesign/issues/"
evaluation_profile: ".alidesign/evaluation-profile.yaml"
capability_routing:
  run_manifest_pattern: ".alidesign/runs/{run_id}/routing.yaml"
  contract: "JSON-compatible YAML; canonical capabilities, sealed revisions, and evaluation rounds are append-only"
retention:
  commit_control_directory: true
  raw_browser_evidence: "Keep only evidence needed to audit the accepted round."
unresolved_authority:
  - "No verified contact, website, or social URL; contact CTA is out of scope rather than fabricated."
  - "Profile v2 has no resolved Cooper-specific personal-brand art-direction provider or selected direction."
