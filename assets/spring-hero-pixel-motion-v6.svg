<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2F85A6"/>
      <stop offset="0.46" stop-color="#6FC2D5"/>
      <stop offset="0.78" stop-color="#D7EECF"/>
      <stop offset="1" stop-color="#FFE5CF"/>
    </linearGradient>
    <linearGradient id="glass" x1="760" y1="82" x2="1160" y2="502" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#111827" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0B1422" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="glassLine" x1="760" y1="98" x2="1138" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.2" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF91BE"/>
      <stop offset="0.5" stop-color="#89D7FF"/>
      <stop offset="1" stop-color="#9CE8BF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#07111F" flood-opacity="0.32"/>
    </filter>
    <style>
      .cloud-a { animation: driftA 28s linear infinite; }
      .cloud-b { animation: driftB 36s linear infinite; }
      .petal-a { animation: fallA 8s linear infinite; }
      .petal-b { animation: fallB 10s linear infinite; }
      .petal-c { animation: fallC 12s linear infinite; }
      .shine { animation: shine 5.8s ease-in-out infinite; }
      .blink { animation: blink 3.6s steps(1) infinite; }
      .grass { animation: grass 2.6s ease-in-out infinite alternate; transform-origin: bottom; }
      @keyframes driftA { from { transform: translateX(-90px); } to { transform: translateX(90px); } }
      @keyframes driftB { from { transform: translateX(80px); } to { transform: translateX(-120px); } }
      @keyframes fallA { from { transform: translate(0,-90px) rotate(0deg); opacity:0; } 12%{opacity:1;} to { transform: translate(-90px,660px) rotate(180deg); opacity:0; } }
      @keyframes fallB { from { transform: translate(0,-120px) rotate(0deg); opacity:0; } 15%{opacity:1;} to { transform: translate(110px,680px) rotate(-220deg); opacity:0; } }
      @keyframes fallC { from { transform: translate(0,-70px) rotate(0deg); opacity:0; } 12%{opacity:1;} to { transform: translate(40px,650px) rotate(160deg); opacity:0; } }
      @keyframes shine { 0%,100% { opacity:.16; transform:translateX(-120px); } 45%,55% { opacity:.72; } 100% { transform:translateX(140px); } }
      @keyframes blink { 0%,94%,100% { opacity:1; } 95%,97% { opacity:.15; } }
      @keyframes grass { from { transform: skewX(-2deg); } to { transform: skewX(2deg); } }
    </style>
  </defs>

