<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0F7990"/>
      <stop offset="0.42" stop-color="#35AFC1"/>
      <stop offset="0.75" stop-color="#BEE7C0"/>
      <stop offset="1" stop-color="#FFE2C9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 260) rotate(90) scale(230 300)">
      <stop stop-color="#FFF2A8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFF2A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="760" y1="232" x2="1130" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#172235" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF8FBE"/><stop offset="0.52" stop-color="#7ED8FF"/><stop offset="1" stop-color="#B4F06E"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#FFFFFF" opacity="0.035"/>
      <rect y="3" width="6" height="3" fill="#001424" opacity="0.045"/>
    </pattern>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="2" height="2" fill="#FFFFFF" opacity="0.12"/>
      <rect x="11" y="5" width="2" height="2" fill="#001424" opacity="0.12"/>
      <rect x="6" y="13" width="2" height="2" fill="#FFFFFF" opacity="0.08"/>
      <rect x="15" y="15" width="2" height="2" fill="#001424" opacity="0.1"/>
    </pattern>
    <filter id="sceneShadow" x="-10%" y="-12%" width="120%" height="132%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#061321" flood-opacity="0.32"/>
    </filter>
    <filter id="logoShadow" x="-10%" y="-35%" width="120%" height="170%">
      <feDropShadow dx="14" dy="18" stdDeviation="0" flood-color="#063447" flood-opacity="0.82"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#D8FF32" flood-opacity="0.42"/>
    </filter>
    <style>
      .cloud-a { animation: cloudA 34s linear infinite; }
      .cloud-b { animation: cloudB 42s linear infinite; }
      .petal-a { animation: petalA 8s linear infinite; }
      .petal-b { animation: petalB 10s linear infinite; }
      .petal-c { animation: petalC 12s linear infinite; }
      .shine { animation: shine 5.5s ease-in-out infinite; }
      .blink { animation: blink 3.7s steps(1) infinite; }
      .bob { animation: bob 2.8s ease-in-out infinite alternate; }
      @keyframes cloudA { from { transform: translateX(-80px); } to { transform: translateX(100px); } }
      @keyframes cloudB { from { transform: translateX(90px); } to { transform: translateX(-120px); } }
      @keyframes petalA { from { transform: translate(0,-100px) rotate(0deg); opacity:0; } 14%{opacity:1;} to { transform: translate(-70px,650px) rotate(210deg); opacity:0; } }
      @keyframes petalB { from { transform: translate(0,-140px) rotate(0deg); opacity:0; } 16%{opacity:1;} to { transform: translate(110px,670px) rotate(-240deg); opacity:0; } }
      @keyframes petalC { from { transform: translate(0,-80px) rotate(0deg); opacity:0; } 14%{opacity:1;} to { transform: translate(35px,640px) rotate(160deg); opacity:0; } }
      @keyframes shine { 0%{opacity:0;transform:translateX(-140px);} 48%,58%{opacity:.48;} 100%{opacity:0;transform:translateX(150px);} }
      @keyframes blink { 0%,94%,100%{opacity:1;} 95%,97%{opacity:.15;} }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    </style>
  </defs>

